<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Halls - VR Experience</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #010101;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #151515 0%, #010101 100%);
            color: white;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        h1 { 
            font-size: 2.5rem;
            margin-bottom: 20px; 
            letter-spacing: 12px;
            color: #ffffff;
        }
        #vr-button {
            padding: 16px 36px;
            font-size: 1rem;
            font-weight: 600;
            background-color: transparent;
            color: #fff;
            border: 2px solid #ffffff;
            cursor: pointer;
            letter-spacing: 3px;
            transition: all 0.3s ease;
        }
        #vr-button:hover {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="overlay">
        <h1>H A L L S</h1>
        <button id="vr-button">LOADING VR...</button>
    </div>

    <script>
        // --- Core Scene & Renderer Configuration ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010101);
        // Deep black fog to swallow up the endless corridor seamlessly
        scene.fog = new THREE.FogExp2(0x010101, 0.28);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        
        // High-end tone mapping to render clean colors and deep shadows accurately
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        // --- VR Player Rig ---
        const userRig = new THREE.Group();
        userRig.add(camera);
        scene.add(userRig);

        // --- WebXR Prompt System ---
        const vrButton = document.getElementById('vr-button');
        const overlay = document.getElementById('overlay');

        if (navigator.xr) {
            navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                if (supported) {
                    vrButton.textContent = 'ENTER VR';
                    vrButton.addEventListener('click', () => {
                        navigator.xr.requestSession('immersive-vr', {
                            requiredFeatures: ['local-floor']
                        }).then((session) => {
                            renderer.xr.setSession(session);
                            overlay.style.opacity = '0';
                            setTimeout(() => overlay.style.display = 'none', 500);
                        });
                    });
                } else {
                    vrButton.textContent = 'VR HEADSET NOT DETECTED';
                }
            });
        } else {
            vrButton.textContent = 'WEBXR NOT SUPPORTED';
        }

        // --- Texture Loading & Polishing (Using Your Uploads) ---
        const textureLoader = new THREE.TextureLoader();
        const wallTex = textureLoader.load('image_89e9a5.jpg');       // Clean white/grey wall
        const floorTex = textureLoader.load('image_89e6fe.jpg');      // Light grey/white floor boards
        const carpetTex = textureLoader.load('image_89e6e1.jpg');     // Alternate carpet asset
        const roofTex = textureLoader.load('https://m.media-amazon.com/images/I/81hWe0R+71L._AC_UL320_.jpg'); // Tiled roof

        // Apply texture repeating parameters for pristine rendering scale
        [wallTex, floorTex, carpetTex, roofTex].forEach(t => {
            t.wrapS = THREE.RepeatWrapping;
            t.wrapT = THREE.RepeatWrapping;
            t.anisotropy = renderer.capabilities.getMaxAnisotropy();
        });
        wallTex.repeat.set(2, 1);
        floorTex.repeat.set(1, 4);
        carpetTex.repeat.set(1, 4);
        roofTex.repeat.set(2, 4);

        // --- Materials System ---
        const wallMaterial = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.5, metalness: 0.05 });
        const pillarMaterial = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.4 }); // Matching clean light columns
        const roofMaterial = new THREE.MeshStandardMaterial({ map: roofTex, roughness: 0.6 });
        const floorMaterial = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.4 });
        const carpetMaterial = new THREE.MeshStandardMaterial({ map: carpetTex, roughness: 0.85 });
        const fixtureMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const glassMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

        // --- Lights Setup ---
        const ambientLight = new THREE.AmbientLight(0x0a0a0a, 0.05); 
        scene.add(ambientLight);

        // Flashlight: Intense cone beam matching your reference request
        const flashlight = new THREE.SpotLight(0xfffbe3, 12, 18, Math.PI / 5, 0.4, 1.2);
        scene.add(flashlight);
        scene.add(flashlight.target);

        // --- Procedural Generation Setup (Pillars, Lights & Core Layout) ---
        const segmentLength = 10;
        const totalSegments = 8; 
        const hallwayWidth = 2.8;
        const hallwayHeight = 3.0;
        const segments = [];

        function createHallwaySegment(zOffset) {
            const segment = new THREE.Group();

            // Left Wall
            const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(segmentLength, hallwayHeight), wallMaterial);
            leftWall.position.set(-hallwayWidth/2, hallwayHeight/2, 0);
            leftWall.rotation.y = Math.PI / 2;
            segment.add(leftWall);

            // Right Wall
            const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(segmentLength, hallwayHeight), wallMaterial);
            rightWall.position.set(hallwayWidth/2, hallwayHeight/2, 0);
            rightWall.rotation.y = -Math.PI / 2;
            segment.add(rightWall);

            // Clean Columns/Pillars (Spaced at the start and middle of each segment like screenshots)
            const pillarGeo = new THREE.BoxGeometry(0.25, hallwayHeight, 0.4);
            
            const leftPillar1 = new THREE.Mesh(pillarGeo, pillarMaterial);
            leftPillar1.position.set(-hallwayWidth/2 + 0.12, hallwayHeight/2, -segmentLength/2);
            segment.add(leftPillar1);

            const rightPillar1 = new THREE.Mesh(pillarGeo, pillarMaterial);
            rightPillar1.position.set(hallwayWidth/2 - 0.12, hallwayHeight/2, -segmentLength/2);
            segment.add(rightPillar1);

            const leftPillar2 = new THREE.Mesh(pillarGeo, pillarMaterial);
            leftPillar2.position.set(-hallwayWidth/2 + 0.12, hallwayHeight/2, segmentLength/2);
            segment.add(leftPillar2);

            const rightPillar2 = new THREE.Mesh(pillarGeo, pillarMaterial);
            rightPillar2.position.set(hallwayWidth/2 - 0.12, hallwayHeight/2, segmentLength/2);
            segment.add(rightPillar2);

            // Ceiling (Drop tiles mapping)
            const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(hallwayWidth, segmentLength), roofMaterial);
            ceiling.position.set(0, hallwayHeight, 0);
            ceiling.rotation.x = Math.PI / 2;
            segment.add(ceiling);

            // Floor Geometry
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(hallwayWidth, segmentLength), floorMaterial);
            floor.position.set(0, 0, 0);
            floor.rotation.x = -Math.PI / 2;
            segment.add(floor);

            // Fluorescent Linear Ceiling Fixture (Office style)
            const fixture = new THREE.Group();
            const casing = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.04, 3.5), fixtureMat);
            const bulb = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.01, 3.4), glassMat);
            casing.position.set(0, hallwayHeight - 0.02, 0);
            bulb.position.set(0, hallwayHeight - 0.04, 0);
            fixture.add(casing, bulb);

            // Overhead Point Light component
            const overheadLight = new THREE.PointLight(0xfff6ed, 4, 9, 1.4);
            overheadLight.position.set(0, hallwayHeight - 0.1, 0);
            fixture.add(overheadLight);
            segment.add(fixture);

            // Cache data handles for independent runtime updates
            segment.userData = {
                floorMesh: floor,
                overheadLight: overheadLight,
                bulbMesh: bulb,
                flickerTimer: Math.random() * 5,
                isFlickering: false
            };

            segment.position.z = zOffset;
            return segment;
        }

        // Initialize Corridor Array Track
        for (let i = 0; i < totalSegments; i++) {
            const seg = createHallwaySegment(-i * segmentLength);
            scene.add(seg);
            segments.push(seg);
        }

        // --- High-Performance VR Locomotion (Joystick Mapping) ---
        const moveSpeed = 1.8; 
        const clock = new THREE.Clock();
        let canSnapTurn = true;

        function handleVRMovement(delta) {
            const session = renderer.xr.getSession();
            if (!session) return;

            for (const source of session.inputSources) {
                if (!source.gamepad) continue;
                const axes = source.gamepad.axes;
                if (axes.length < 2) continue;

                // Normalize standard index mappings for standard VR controllers
                const xJoy = axes[0]; 
                const yJoy = axes[1]; 

                // LEFT CONTROLLER: Smooth Walk & Strafe
                if (source.handedness === 'left') {
                    if (Math.abs(xJoy) > 0.12 || Math.abs(yJoy) > 0.12) {
                        const direction = new THREE.Vector3();
                        camera.getWorldDirection(direction);
                        direction.y = 0; // Absolute ground lock
                        direction.normalize();

                        const side = new THREE.Vector3();
                        side.crossVectors(direction, camera.up).normalize();

                        userRig.position.addScaledVector(direction, -yJoy * moveSpeed * delta);
                        userRig.position.addScaledVector(side, xJoy * moveSpeed * delta);
                    }
                }

                // RIGHT CONTROLLER: Cinematic Snap Turning
                if (source.handedness === 'right') {
                    if (Math.abs(xJoy) > 0.7) {
                        if (canSnapTurn) {
                            const turnAngle = xJoy > 0 ? -Math.PI / 4 : Math.PI / 4;
                            userRig.rotateY(turnAngle);
                            canSnapTurn = false;
                        }
                    } else {
                        canSnapTurn = true;
                    }
                }
            }
        }

        // --- Individual Segment Light Dynamics ---
        function handleSegmentLights(delta) {
            segments.forEach((seg) => {
                const data = seg.userData;
                data.flickerTimer -= delta;

                if (data.flickerTimer <= 0) {
                    data.isFlickering = Math.random() > 0.8; // Random architectural light faults
                    data.flickerTimer = data.isFlickering ? Math.random() * 0.5 : Math.random() * 10 + 5;
                }

                if (data.isFlickering) {
                    const sample = Math.random();
                    if (sample > 0.85) {
                        data.overheadLight.intensity = 6.0; // Overvoltage flare
                        data.bulbMesh.material.color.setHex(0xffffff);
                    } else if (sample > 0.4) {
                        data.overheadLight.intensity = 0.1; // Dim buzz drop
                        data.bulbMesh.material.color.setHex(0x222222);
                    } else {
                        data.overheadLight.intensity = 0.0; // Total drop frame
                        data.bulbMesh.material.color.setHex(0x050505);
                    }
                } else {
                    // Constant realistic hum
                    data.overheadLight.intensity = 3.5 + (Math.sin(Date.now() * 0.005 + seg.position.z) * 0.15);
                    data.bulbMesh.material.color.setHex(0xffffff);
                }
            });
        }

        // --- Seamless Segment Recycling Loop ---
        function handleInfiniteGeneration() {
            segments.forEach((seg) => {
                if (seg.position.z > userRig.position.z + segmentLength) {
                    let furthestZ = userRig.position.z;
                    segments.forEach(s => { if (s.position.z < furthestZ) furthestZ = s.position.z; });
                    
                    // Displace chunk cleanly ahead inside the fog boundary
                    seg.position.z = furthestZ - segmentLength;
                    
                    // Procedurally cycle between wood floorboards or carpet sections on update
                    const selectCarpet = Math.random() > 0.75;
                    seg.userData.floorMesh.material = selectCarpet ? carpetMaterial : floorMaterial;
                }
            });
        }

        // --- Main Render Execution Frame ---
        renderer.setAnimationLoop(() => {
            const delta = clock.getDelta();

            handleVRMovement(delta);
            handleSegmentLights(delta);
            handleInfiniteGeneration();

            // Lock Flashlight matrix transform tracking directly over the WebXR camera head tracking
            const headPosition = new THREE.Vector3();
            camera.getWorldPosition(headPosition);
            flashlight.position.copy(headPosition);

            const lookDirection = new THREE.Vector3();
            camera.getWorldDirection(lookDirection);
            flashlight.target.position.copy(headPosition).add(lookDirection);

            renderer.render(scene, camera);
        });

        // Track display resolution alterations dynamically
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
