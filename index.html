<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Halls - VR Experience</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        h1 { margin-bottom: 10px; letter-spacing: 2px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="overlay">
        <h1>HALLS</h1>
        <p>Connecting to VR...</p>
    </div>

    <script>
        // --- Setup Scene, Camera, and Renderer ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.FogExp2(0x050505, 0.18);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        // --- Rig for Joystick Movement ---
        const userRig = new THREE.Group();
        userRig.position.set(0, 0, 0);
        userRig.add(camera);
        scene.add(userRig);

        // --- Automatically Initiate VR Session ---
        if (navigator.xr) {
            navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                if (supported) {
                    navigator.xr.requestSession('immersive-vr', {
                        optionalFeatures: ['local-floor', 'bounded-floor']
                    }).then((session) => {
                        renderer.xr.setSession(session);
                        document.getElementById('overlay').style.display = 'none';
                    }).catch(err => console.error("VR Session failed:", err));
                }
            });
        }

        // --- Texture Loading ---
        const textureLoader = new THREE.TextureLoader();
        
        const ventTex = textureLoader.load('https://i.postimg.cc/rwxxRpCn/Vent-Tex.png');
        const roofTex = textureLoader.load('https://i.postimg.cc/MTFvFkmq/Tile3.png');
        const floorTex = textureLoader.load('https://i.postimg.cc/dtdjrnJ0/Backing.png');
        const carpetTex = textureLoader.load('https://i.postimg.cc/pd0fR6BW/Brown-Carpet.png');

        // Configure texture wrapping
        [roofTex, floorTex, carpetTex].forEach(t => {
            t.wrapS = THREE.RepeatWrapping;
            t.wrapT = THREE.RepeatWrapping;
        });
        roofTex.repeat.set(1, 3);
        floorTex.repeat.set(1, 3);
        carpetTex.repeat.set(1, 3);

        // --- Materials ---
        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 });
        const ventMaterial = new THREE.MeshStandardMaterial({ map: ventTex, transparent: true, roughness: 0.6 });
        const roofMaterial = new THREE.MeshStandardMaterial({ map: roofTex, roughness: 0.8 });
        const floorMaterial = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.7 });
        const carpetMaterial = new THREE.MeshStandardMaterial({ map: carpetTex, roughness: 1.0 });

        // --- Lighting & Flickering System ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.01);
        scene.add(ambientLight);

        // Flashlight attached to player head
        const flashlight = new THREE.PointLight(0xfff5ea, 1.2, 12);
        scene.add(flashlight);

        // Spooky ambient ceiling lights that flicker realistically
        const ceilingLight = new THREE.PointLight(0xddddff, 0.8, 15);
        ceilingLight.position.set(0, 3, -5);
        scene.add(ceilingLight);

        let flickerTimer = 0;
        let isFlickering = false;
        let targetIntensity = 0.8;

        function updateFlicker(delta) {
            flickerTimer -= delta;
            if (flickerTimer <= 0) {
                isFlickering = Math.random() > 0.7; // 30% chance to start a flicker fit
                flickerTimer = isFlickering ? Math.random() * 0.5 : Math.random() * 4 + 2; 
            }

            if (isFlickering) {
                // Rapidly jump between dead dark, dim, and bursting light
                const rand = Math.random();
                if (rand > 0.8) targetIntensity = 1.4;       // Spark flare
                else if (rand > 0.3) targetIntensity = 0.1;  // Near dead
                else targetIntensity = 0.0;                  // Total blackout
            } else {
                targetIntensity = 0.8; // Stable humming light
            }
            // Smoothly interpolate to avoid artificial jaggedness
            ceilingLight.intensity = THREE.MathUtils.lerp(ceilingLight.intensity, targetIntensity, 0.4);
        }

        // --- Hallway Generation Architecture ---
        const segmentLength = 10;
        const totalSegments = 6;
        const hallwayWidth = 2.6;
        const hallwayHeight = 3.2;
        const segments = [];

        function createHallwaySegment(zOffset) {
            const segment = new THREE.Group();

            // Left Wall
            const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(segmentLength, hallwayHeight), wallMaterial);
            leftWall.position.set(-hallwayWidth/2, hallwayHeight/2, 0);
            leftWall.rotation.y = Math.PI / 2;
            segment.add(leftWall);

            // Right Wall
            const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(segmentLength, hallwayHeight), wallMaterial);
            rightWall.position.set(hallwayWidth/2, hallwayHeight/2, 0);
            rightWall.rotation.y = -Math.PI / 2;
            segment.add(rightWall);

            // Dynamic Vents (Occasional wall placement)
            if (Math.random() > 0.4) {
                const vent = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.2), ventMaterial);
                const side = Math.random() > 0.5 ? 1 : -1;
                vent.position.set((hallwayWidth/2 - 0.01) * side, hallwayHeight * 0.7, (Math.random() - 0.5) * 6);
                vent.rotation.y = side === 1 ? -Math.PI / 2 : Math.PI / 2;
                segment.add(vent);
            }

            // Ceiling (Using Roof Tiles)
            const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(hallwayWidth, segmentLength), roofMaterial);
            ceiling.position.set(0, hallwayHeight, 0);
            ceiling.rotation.x = Math.PI / 2;
            segment.add(ceiling);

            // Floor Selection (Occasional Carpet swap)
            const useCarpet = Math.random() > 0.75;
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(hallwayWidth, segmentLength), 
                useCarpet ? carpetMaterial : floorMaterial
            );
            floor.position.set(0, 0, 0);
            floor.rotation.x = -Math.PI / 2;
            segment.add(floor);

            segment.position.z = zOffset;
            return segment;
        }

        // Initialize world array
        for (let i = 0; i < totalSegments; i++) {
            const seg = createHallwaySegment(-i * segmentLength);
            scene.add(seg);
            segments.push(seg);
        }

        // --- VR Locomotion (Joystick Input Parsing) ---
        const moveSpeed = 1.8; // Meters per second
        const clock = new THREE.Clock();

        function handleMovement(delta) {
            const session = renderer.xr.getSession();
            if (!session) return;

            // Iterate over active input sources (VR Controllers)
            for (const source of session.inputSources) {
                if (source.gamepad && source.gamepad.axes) {
                    const axes = source.gamepad.axes;
                    
                    // Left thumbstick axes mappings standard (usually axes 2 and 3, or 0 and 1)
                    const x = axes[0] || 0; // Strafe
                    const z = axes[1] || 0; // Forward/Backward

                    if (Math.abs(x) > 0.1 || Math.abs(z) > 0.1) {
                        // Get horizontal camera direction vector
                        const direction = new THREE.Vector3();
                        camera.getWorldDirection(direction);
                        direction.y = 0;
                        direction.normalize();

                        // Side vector
                        const side = new THREE.Vector3();
                        side.crossVectors(direction, camera.up).normalize();

                        // Apply movement scaled by frame delta time
                        userRig.position.addScaledVector(direction, -z * moveSpeed * delta);
                        userRig.position.addScaledVector(side, x * moveSpeed * delta);
                    }
                }
            }
        }

        // --- Animation Frame Loop ---
        renderer.setAnimationLoop(() => {
            const delta = clock.getDelta();

            // Run Systems
            handleMovement(delta);
            updateFlicker(delta);

            // Pin user elements
            flashlight.position.copy(camera.position).add(userRig.position);
            // Lock ceiling lamp relative distance ahead of player track
            ceilingLight.position.z = userRig.position.z - 4;

            // Infinite Room Recycling Loop
            segments.forEach((seg) => {
                if (seg.position.z > userRig.position.z + segmentLength) {
                    let furthestZ = userRig.position.z;
                    segments.forEach(s => { if (s.position.z < furthestZ) furthestZ = s.position.z; });
                    
                    // Reposition piece forward and mutate attributes dynamically
                    seg.position.z = furthestZ - segmentLength;
                    
                    // Randomize floor type dynamically on reuse
                    const floorMesh = seg.children.find(c => c.rotation.x === -Math.PI / 2);
                    if(floorMesh) floorMesh.material = Math.random() > 0.75 ? carpetMaterial : floorMaterial;
                }
            });

            renderer.render(scene, camera);
        });

        // Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
