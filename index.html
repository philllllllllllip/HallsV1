<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Halls - VR Experience</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #1a1a1a 0%, #050505 100%);
            color: white;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        h1 { 
            font-size: 2.5rem;
            margin-bottom: 20px; 
            letter-spacing: 12px;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }
        #vr-button {
            padding: 16px 36px;
            font-size: 1rem;
            font-weight: 600;
            background-color: transparent;
            color: #fff;
            border: 2px solid #ffffff;
            border-radius: 0px;
            cursor: pointer;
            letter-spacing: 3px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #vr-button:hover {
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0 0 30px rgba(255,255,255,0.4);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="overlay">
        <h1>H A L L S</h1>
        <button id="vr-button">INITIALIZING...</button>
    </div>

    <script>
        // --- Core Scene Configuration ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020202);
        // Clean high-density fog to swallow the corridor seamlessly into darkness
        scene.fog = new THREE.FogExp2(0x020202, 0.22);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        
        // Professional rendering settings for realistic textures and lighting
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        // --- VR Rig System ---
        const userRig = new THREE.Group();
        userRig.add(camera);
        scene.add(userRig);

        // --- WebXR Session Management ---
        const vrButton = document.getElementById('vr-button');
        const overlay = document.getElementById('overlay');

        if (navigator.xr) {
            navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                if (supported) {
                    vrButton.textContent = 'ENTER VR ASSET';
                    vrButton.addEventListener('click', () => {
                        navigator.xr.requestSession('immersive-vr', {
                            requiredFeatures: ['local-floor']
                        }).then((session) => {
                            renderer.xr.setSession(session);
                            overlay.style.opacity = '0';
                            setTimeout(() => overlay.style.display = 'none', 500);
                        });
                    });
                } else {
                    vrButton.textContent = 'VR HEADSET NOT FOUND';
                }
            });
        } else {
            vrButton.textContent = 'WEBXR NOT SUPPORTED';
        }

        // --- Texture Loading & Optimization ---
        const textureLoader = new THREE.TextureLoader();
        const ventTex = textureLoader.load('https://i.postimg.cc/rwxxRpCn/Vent-Tex.png');
        const roofTex = textureLoader.load('https://i.postimg.cc/MTFvFkmq/Tile3.png');
        const floorTex = textureLoader.load('https://i.postimg.cc/dtdjrnJ0/Backing.png');
        const carpetTex = textureLoader.load('https://i.postimg.cc/pd0fR6BW/Brown-Carpet.png');

        [roofTex, floorTex, carpetTex].forEach(t => {
            t.wrapS = THREE.RepeatWrapping;
            t.wrapT = THREE.RepeatWrapping;
            t.anisotropy = renderer.capabilities.getMaxAnisotropy();
        });
        roofTex.repeat.set(1, 4);
        floorTex.repeat.set(1, 4);
        carpetTex.repeat.set(1, 4);

        // --- Professional Material Architecture ---
        // Clean, matte light-grey/white walls
        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.6, metalness: 0.02 });
        const trimMaterial = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 }); // Baseboards
        const ventMaterial = new THREE.MeshStandardMaterial({ map: ventTex, transparent: true, roughness: 0.5 });
        const roofMaterial = new THREE.MeshStandardMaterial({ map: roofTex, roughness: 0.7 });
        const floorMaterial = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.5 });
        const carpetMaterial = new THREE.MeshStandardMaterial({ map: carpetTex, roughness: 0.9 });
        const lightFixtureMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const lightGlassMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

        // --- Environment Lighting ---
        const ambientLight = new THREE.AmbientLight(0x05050a, 0.15); 
        scene.add(ambientLight);

        // Subtle face-mounted flashlight for local visibility
        const flashlight = new THREE.SpotLight(0xfff8ee, 4, 10, Math.PI / 4, 0.5, 1);
        scene.add(flashlight);
        scene.add(flashlight.target);

        // --- Modular Segment Generation ---
        const segmentLength = 10;
        const totalSegments = 8; // Increased segment count to blend perfectly into distant fog
        const hallwayWidth = 2.4;
        const hallwayHeight = 3.0;
        const segments = [];

        function createHallwaySegment(zOffset) {
            const segment = new THREE.Group();

            // Left & Right Structural Walls
            const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(segmentLength, hallwayHeight), wallMaterial);
            leftWall.position.set(-hallwayWidth/2, hallwayHeight/2, 0);
            leftWall.rotation.y = Math.PI / 2;
            segment.add(leftWall);

            const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(segmentLength, hallwayHeight), wallMaterial);
            rightWall.position.set(hallwayWidth/2, hallwayHeight/2, 0);
            rightWall.rotation.y = -Math.PI / 2;
            segment.add(rightWall);

            // Baseboards / Trims (Adds realistic depth to walls)
            const trimGeo = new THREE.BoxGeometry(segmentLength, 0.12, 0.02);
            const leftTrim = new THREE.Mesh(trimGeo, trimMaterial);
            leftTrim.position.set(-hallwayWidth/2 + 0.01, 0.06, 0);
            leftTrim.rotation.y = Math.PI / 2;
            segment.add(leftTrim);

            const rightTrim = new THREE.Mesh(trimGeo, trimMaterial);
            rightTrim.position.set(hallwayWidth/2 - 0.01, 0.06, 0);
            rightTrim.rotation.y = -Math.PI / 2;
            segment.add(rightTrim);

            // Ceiling (Roof Tiles)
            const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(hallwayWidth, segmentLength), roofMaterial);
            ceiling.position.set(0, hallwayHeight, 0);
            ceiling.rotation.x = Math.PI / 2;
            segment.add(ceiling);

            // Floor Geometry
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(hallwayWidth, segmentLength), floorMaterial);
            floor.position.set(0, 0, 0);
            floor.rotation.x = -Math.PI / 2;
            segment.add(floor);

            // Procedural Wall Vents
            if (Math.random() > 0.5) {
                const vent = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 1.2), ventMaterial);
                const side = Math.random() > 0.5 ? 1 : -1;
                vent.position.set((hallwayWidth/2 - 0.005) * side, hallwayHeight * 0.6, (Math.random() - 0.5) * 4);
                vent.rotation.y = side === 1 ? -Math.PI / 2 : Math.PI / 2;
                segment.add(vent);
            }

            // Localized Ceiling Light Fixture per segment
            const fixture = new THREE.Group();
            const casing = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.05, 2), lightFixtureMat);
            const bulb = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.02, 1.9), lightGlassMat);
            casing.position.set(0, hallwayHeight - 0.025, 0);
            bulb.position.set(0, hallwayHeight - 0.05, 0);
            fixture.add(casing, bulb);

            // Segment Specific Point Light
            const pLight = new THREE.PointLight(0xfff6e9, 5, 8, 1.5);
            pLight.position.set(0, hallwayHeight - 0.1, 0);
            fixture.add(pLight);
            segment.add(fixture);

            // Store custom reference metadata for runtime modifiers
            segment.userData = {
                floorMesh: floor,
                pointLight: pLight,
                bulbMesh: bulb,
                flickerTimer: Math.random() * 4,
                isFlickering: false
            };

            segment.position.z = zOffset;
            return segment;
        }

        // Initialize Generation Track
        for (let i = 0; i < totalSegments; i++) {
            const seg = createHallwaySegment(-i * segmentLength);
            scene.add(seg);
            segments.push(seg);
        }

        // --- High-Fidelity VR Controller Input Parser ---
        const moveSpeed = 2.0; 
        const clock = new THREE.Clock();
        let canSnapTurn = true;

        function handleLocomotion(delta) {
            const session = renderer.xr.getSession();
            if (!session) return;

            for (const source of session.inputSources) {
                if (!source.gamepad) continue;
                const axes = source.gamepad.axes;
                if (axes.length < 2) continue;

                // Detect true WebXR standard mapping indexes dynamically
                const hAxis = axes.length > 2 ? axes[2] : axes[0]; // Horizontal Axis
                const vAxis = axes.length > 2 ? axes[3] : axes[1]; // Vertical Axis

                // LEFT HAND: Smooth Movement
                if (source.handedness === 'left') {
                    if (Math.abs(hAxis) > 0.15 || Math.abs(vAxis) > 0.15) {
                        const direction = new THREE.Vector3();
                        camera.getWorldDirection(direction);
                        direction.y = 0;
                        direction.normalize();

                        const side = new THREE.Vector3();
                        side.crossVectors(direction, camera.up).normalize();

                        userRig.position.addScaledVector(direction, -vAxis * moveSpeed * delta);
                        userRig.position.addScaledVector(side, hAxis * moveSpeed * delta);
                    }
                }

                // RIGHT HAND: Snap Turning (Prevents VR Motion Sickness)
                if (source.handedness === 'right') {
                    if (Math.abs(hAxis) > 0.7) {
                        if (canSnapTurn) {
                            const angle = hAxis > 0 ? -Math.PI / 4 : Math.PI / 4;
                            userRig.rotateY(angle);
                            canSnapTurn = false;
                        }
                    } else {
                        canSnapTurn = true;
                    }
                }
            }
        }

        // --- Dynamic Segment Shading & Independent Flickering ---
        function updateSegmentDynamics(delta) {
            segments.forEach((seg) => {
                const data = seg.userData;
                data.flickerTimer -= delta;

                if (data.flickerTimer <= 0) {
                    data.isFlickering = Math.random() > 0.85; // 15% chance to experience structural fault
                    data.flickerTimer = data.isFlickering ? Math.random() * 0.6 : Math.random() * 8 + 4;
                }

                if (data.isFlickering) {
                    const rand = Math.random();
                    if (rand > 0.8) {
                        data.pointLight.intensity = 7.0; // Voltage spike
                        data.bulbMesh.material.color.setHex(0xffffff);
                    } else if (rand > 0.3) {
                        data.pointLight.intensity = 0.2; // Dim down drop
                        data.bulbMesh.material.color.setHex(0x333333);
                    } else {
                        data.pointLight.intensity = 0.0; // Complete blackout frame
                        data.bulbMesh.material.color.setHex(0x111111);
                    }
                } else {
                    // Stable current emission
                    data.pointLight.intensity = 4.5 + (Math.sin(Date.now() * 0.008 + seg.position.z) * 0.2);
                    data.bulbMesh.material.color.setHex(0xffffff);
                }
            });
        }

        // --- Infinite Track Recycling Loop ---
        function recycleSegments() {
            segments.forEach((seg) => {
                // If segment trails completely behind the active viewpoint plane
                if (seg.position.z > userRig.position.z + segmentLength) {
                    let furthestZ = userRig.position.z;
                    segments.forEach(s => { if (s.position.z < furthestZ) furthestZ = s.position.z; });
                    
                    // Reposition forward seamlessly in distance depth
                    seg.position.z = furthestZ - segmentLength;
                    
                    // Procedurally shuffle architectural floor layout on reload loop
                    const isCarpet = Math.random() > 0.8;
                    seg.userData.floorMesh.material = isCarpet ? carpetMaterial : floorMaterial;
                }
            });
        }

        // --- Core Application Loop Execution ---
        renderer.setAnimationLoop(() => {
            const delta = clock.getDelta();

            // Run Systems
            handleLocomotion(delta);
            updateSegmentDynamics(delta);
            recycleSegments();

            // Flashlight Vector Matrix Tracking
            const headPos = new THREE.Vector3();
            camera.getWorldPosition(headPos);
            flashlight.position.copy(headPos);

            const dirVector = new THREE.Vector3();
            camera.getWorldDirection(dirVector);
            flashlight.target.position.copy(headPos).add(dirVector);

            renderer.render(scene, camera);
        });

        // --- Window Adjustments ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
