<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Art Studio - Quest Fixed</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #1a1a1a;
            color: white;
            z-index: 10;
        }
        h1 { 
            font-size: 2rem;
            margin-bottom: 20px; 
            letter-spacing: 4px;
        }
        #vr-button {
            padding: 16px 40px;
            font-size: 1rem;
            font-weight: 600;
            background-color: #fff;
            color: #000;
            border: none;
            cursor: pointer;
            letter-spacing: 2px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="overlay">
        <h1>VR ART STUDIO</h1>
        <button id="vr-button">ENTER VR</button>
    </div>

    <script>
        // --- Scene & Renderer Configuration ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x14110f);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.6, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        
        // High-end lighting profile to make colors pop and look professional
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        // --- WebXR Quest Booter ---
        const vrButton = document.getElementById('vr-button');
        const overlay = document.getElementById('overlay');

        if (navigator.xr) {
            navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                if (supported) {
                    vrButton.addEventListener('click', () => {
                        navigator.xr.requestSession('immersive-vr', { requiredFeatures: ['local-floor'] })
                        .then((session) => {
                            renderer.xr.setSession(session);
                            overlay.style.display = 'none';
                        });
                    });
                } else { vrButton.textContent = 'XR NOT FOUND ON THIS BROWSER'; }
            });
        }

        // --- Fast Procedural Texture Engine (No External Image Dependencies) ---
        function generateStudioTextures() {
            // Wood Grain for Easel and Table
            const woodCanvas = document.createElement('canvas');
            woodCanvas.width = 256; woodCanvas.height = 256;
            const wCtx = woodCanvas.getContext('2d');
            wCtx.fillStyle = '#6e4726'; wCtx.fillRect(0, 0, 256, 256);
            wCtx.fillStyle = '#4a2f17';
            for(let i=0; i<60; i++) { wCtx.fillRect(Math.random()*256, 0, Math.random()*3+1, 256); }
            
            // Studio Floor Planks
            const floorCanvas = document.createElement('canvas');
            floorCanvas.width = 512; floorCanvas.height = 512;
            const fCtx = floorCanvas.getContext('2d');
            fCtx.fillStyle = '#a18262'; fCtx.fillRect(0, 0, 512, 512);
            fCtx.fillStyle = '#59432f';
            for(let i=0; i<512; i+=64) { fCtx.fillRect(i, 0, 2, 512); } // Plank lines

            const woodTex = new THREE.CanvasTexture(woodCanvas);
            const floorTex = new THREE.CanvasTexture(floorCanvas);
            floorTex.wrapS = THREE.RepeatWrapping; floorTex.wrapT = THREE.RepeatWrapping;
            floorTex.repeat.set(4, 4);

            return { wood: woodTex, floor: floorTex };
        }
        const studioTextures = generateStudioTextures();

        // --- Lighting ---
        const ambient = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambient);

        const spotLight = new THREE.DirectionalLight(0xfff4e0, 1.0);
        spotLight.position.set(2, 6, 2);
        scene.add(spotLight);

        // --- Room Construction ---
        const room = new THREE.Group();
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xd6d1cd, roughness: 0.8 }); // Clean off-white walls
        const floorMat = new THREE.MeshStandardMaterial({ map: studioTextures.floor, roughness: 0.5 });
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), floorMat); floor.rotation.x = -Math.PI/2; room.add(floor);
        const roof = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), roofMat); roof.position.y = 3.5; roof.rotation.x = Math.PI/2; room.add(roof);
        
        const backWall = new THREE.Mesh(new THREE.PlaneGeometry(8, 3.5), wallMat); backWall.position.set(0, 1.75, -4); room.add(backWall);
        const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(8, 3.5), wallMat); leftWall.position.set(-4, 1.75, 0); leftWall.rotation.y = Math.PI/2; room.add(leftWall);
        const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(8, 3.5), wallMat); rightWall.position.set(4, 1.75, 0); rightWall.rotation.y = -Math.PI/2; room.add(rightWall);
        scene.add(room);

        // --- Drawing Canvas (Paper Setup) ---
        const drawCanvas = document.createElement('canvas');
        drawCanvas.width = 1024; drawCanvas.height = 1024;
        const drawCtx = drawCanvas.getContext('2d');
        drawCtx.fillStyle = '#ffffff'; drawCtx.fillRect(0, 0, 1024, 1024);

        const canvasTexture = new THREE.CanvasTexture(drawCanvas);
        const canvasMaterial = new THREE.MeshStandardMaterial({ map: canvasTexture, roughness: 0.9 });

        // --- Easel Board & Paper Stand ---
        const easel = new THREE.Group();
        easel.position.set(0, 0, -1.3);

        const woodMat = new THREE.MeshStandardMaterial({ map: studioTextures.wood, roughness: 0.6 });
        
        const frame = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.8, 0.04), woodMat);
        frame.position.set(0, 1.4, 0);
        frame.rotation.x = -0.05;
        easel.add(frame);

        const paper = new THREE.Mesh(new THREE.PlaneGeometry(0.95, 0.75), canvasMaterial);
        paper.position.set(0, 1.4, 0.021);
        paper.rotation.x = -0.05;
        easel.add(paper);

        // Legs
        const legG = new THREE.BoxGeometry(0.04, 2.0, 0.04);
        const lLeg = new THREE.Mesh(legG, woodMat); lLeg.position.set(-0.35, 1.0, -0.05); lLeg.rotation.z = -0.08; easel.add(lLeg);
        const rLeg = new THREE.Mesh(legG, woodMat); rLeg.position.set(0.35, 1.0, -0.05); rLeg.rotation.z = 0.08; easel.add(rLeg);
        scene.add(easel);

        // --- Supplies Table ---
        const table = new THREE.Group();
        table.position.set(0.75, 0, -1.0);
        const topMesh = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.04, 0.9), woodMat);
        topMesh.position.y = 0.8;
        table.add(topMesh);
        scene.add(table);

        // --- Color Selection Trays ---
        const colors = [
            { hex: '#ff0000', rgb: 0xff0000, pos: new THREE.Vector3(-0.15, 0.82, -0.2) }, // Red
            { hex: '#00ff00', rgb: 0x00ff00, pos: new THREE.Vector3(0.0, 0.82, -0.2) },  // Green
            { hex: '#0000ff', rgb: 0x0000ff, pos: new THREE.Vector3(0.15, 0.82, -0.2) }, // Blue
            { hex: '#ffff00', rgb: 0xffff00, pos: new THREE.Vector3(-0.15, 0.82, 0.0) }, // Yellow
            { hex: '#000000', rgb: 0x000000, pos: new THREE.Vector3(0.0, 0.82, 0.0) },   // Black
            { hex: '#ffffff', rgb: 0xffffff, pos: new THREE.Vector3(0.15, 0.82, 0.0) }   // White
        ];

        const interactables = [];

        colors.forEach(c => {
            const paintGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.015, 16);
            const paintMat = new THREE.MeshStandardMaterial({ color: c.rgb, roughness: 0.3 });
            const paintMesh = new THREE.Mesh(paintGeo, paintMat);
            paintMesh.position.copy(c.pos);
            paintMesh.userData = { type: 'color', value: c.hex };
            table.add(paintMesh);
            interactables.push(paintMesh);
        });

        // Brush Sizes Pots
        const sizes = [
            { value: 8, radius: 0.01, pos: new THREE.Vector3(-0.1, 0.82, 0.25) },   // Small
            { value: 24, radius: 0.02, pos: new THREE.Vector3(0.1, 0.82, 0.25) }    // Large
        ];

        sizes.forEach(s => {
            const pot = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.02, 0.06), new THREE.MeshStandardMaterial({ color: 0x222222 }));
            pot.position.copy(s.pos);
            pot.userData = { type: 'size', value: s.value };
            table.add(pot);
            interactables.push(pot);

            // Size Indicator Dot
            const dot = new THREE.Mesh(new THREE.CylinderGeometry(s.radius, s.radius, 0.022, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
            dot.position.copy(s.pos);
            table.add(dot);
        });

        // --- Global Painting Variables ---
        let activeColor = '#ff0000';
        let activeSize = 16;
        let drawing = false;
        let lastX = null, lastY = null;

        // --- Quest Hand / Controller Tracking Setup ---
        const userRig = new THREE.Group();
        userRig.add(camera);
        scene.add(userRig);

        const raycaster = new THREE.Raycaster();
        const rightController = renderer.xr.getController(1); // Right Hand
        userRig.add(rightController);

        // Physical Brush Mesh Object attached to your controller orientation
        const brushMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.004, 0.2), woodMat);
        brushMesh.rotateX(Math.PI/2);
        brushMesh.position.set(0, 0, -0.05);
        rightController.add(brushMesh);

        const tipMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const brushTip = new THREE.Mesh(new THREE.CylinderGeometry(0.001, 0.006, 0.02), tipMat);
        brushTip.rotateX(Math.PI/2);
        brushTip.position.set(0, 0, -0.15);
        rightController.add(brushTip);

        // Visual Interaction Pointer Beam
        const beamGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-2)]);
        const beamMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
        const pointerLine = new THREE.Line(beamGeo, beamMat);
        rightController.add(pointerLine);

        // Right Controller Input Bindings
        rightController.addEventListener('selectstart', () => { drawing = true; });
        rightController.addEventListener('selectend', () => { drawing = false; lastX = null; lastY = null; });

        // --- Core Application Loop ---
        renderer.setAnimationLoop(() => {
            const rotMatrix = new THREE.Matrix4();
            rotMatrix.identity().extractRotation(rightController.matrixWorld);
            
            raycaster.ray.origin.setFromMatrixPosition(rightController.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(rotMatrix);

            // Intersection Tests
            const boardHits = raycaster.intersectObject(paper);

            if (boardHits.length > 0) {
                const hit = boardHits[0];
                const uv = hit.uv;
                pointerLine.scale.z = hit.distance / 2; // Snap line length to board surface

                const canvasX = uv.x * drawCanvas.width;
                const canvasY = (1 - uv.y) * drawCanvas.height;

                if (drawing) {
                    drawCtx.strokeStyle = activeColor;
                    drawCtx.fillStyle = activeColor;
                    drawCtx.lineCap = 'round';
                    drawCtx.lineJoin = 'round';
                    drawCtx.lineWidth = activeSize;

                    drawCtx.beginPath();
                    if (lastX !== null && lastY !== null) {
                        drawCtx.moveTo(lastX, lastY);
                        drawCtx.lineTo(canvasX, canvasY);
                        drawCtx.stroke();
                    } else {
                        drawCtx.arc(canvasX, canvasY, activeSize/2, 0, Math.PI*2);
                        drawCtx.fill();
                    }
                    drawCtx.closePath();

                    lastX = canvasX; lastY = canvasY;
                    canvasTexture.needsUpdate = true;
                }
            } else {
                pointerLine.scale.z = 1;
                lastX = null; lastY = null;

                if (drawing) {
                    const supplyHits = raycaster.intersectObjects(interactables);
                    if (supplyHits.length > 0) {
                        const targetData = supplyHits[0].object.userData;
                        if (targetData.type === 'color') {
                            activeColor = targetData.value;
                            tipMat.color.set(targetData.value); // Dip brush bristle color visually
                        } else if (targetData.type === 'size') {
                            activeSize = targetData.value;
                        }
                        drawing = false; // Reset toggle flag to clear accidental holds
                    }
                }
            }

            renderer.render(scene, camera);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
