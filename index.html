<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Halls - VR Experience</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #050505;
            color: white;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        h1 { 
            font-size: 2.5rem;
            margin-bottom: 20px; 
            letter-spacing: 12px;
        }
        #vr-button {
            padding: 16px 36px;
            font-size: 1rem;
            font-weight: 600;
            background-color: transparent;
            color: #fff;
            border: 2px solid #ffffff;
            cursor: pointer;
            letter-spacing: 3px;
        }
        #vr-button:hover {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="overlay">
        <h1>H A L L S</h1>
        <button id="vr-button">START VR</button>
    </div>

    <script>
        // --- Core Engine Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        // Heavy realistic fog to swallow light maps into total pitch darkness
        scene.fog = new THREE.FogExp2(0x000000, 0.35);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 100);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        
        // HDR/ACES Tone mapping configuration to handle intense realistic emissive glows
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.8; 
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        // --- VR Tracked Player Rig ---
        const userRig = new THREE.Group();
        userRig.add(camera);
        scene.add(userRig);

        // --- WebXR Prompt System ---
        const vrButton = document.getElementById('vr-button');
        const overlay = document.getElementById('overlay');

        if (navigator.xr) {
            navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                if (supported) {
                    vrButton.addEventListener('click', () => {
                        navigator.xr.requestSession('immersive-vr', { requiredFeatures: ['local-floor'] })
                        .then((session) => {
                            renderer.xr.setSession(session);
                            overlay.style.opacity = '0';
                            setTimeout(() => overlay.style.display = 'none', 500);
                        });
                    });
                } else { vrButton.textContent = 'HEADSET NOT FOUND'; }
            });
        }

        // --- Texture Processing (Using Your Provided Assets) ---
        const textureLoader = new THREE.TextureLoader();
        const wallTex = textureLoader.load('image_89e9a5.jpg');       // Your clean wall asset
        const floorTex = textureLoader.load('image_89e6fe.jpg');      // Your light grey floorboards
        const carpetTex = textureLoader.load('image_89e6e1.jpg');     // Your alternate carpet asset
        const roofTex = textureLoader.load('https://m.media-amazon.com/images/I/81hWe0R+71L._AC_UL320_.jpg'); // Amazon roof tile

        [wallTex, floorTex, carpetTex, roofTex].forEach(t => {
            t.wrapS = THREE.RepeatWrapping;
            t.wrapT = THREE.RepeatWrapping;
            t.anisotropy = renderer.capabilities.getMaxAnisotropy();
        });
        wallTex.repeat.set(2, 1);
        floorTex.repeat.set(1, 4);
        carpetTex.repeat.set(1, 4);
        roofTex.repeat.set(2, 4);

        // --- Realistic Matte Materials ---
        const wallMaterial = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.6, metalness: 0.02 });
        const pillarMaterial = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.5 }); 
        const roofMaterial = new THREE.MeshStandardMaterial({ map: roofTex, roughness: 0.7 });
        const floorMaterial = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.5 });
        const carpetMaterial = new THREE.MeshStandardMaterial({ map: carpetTex, roughness: 0.9 });
        const fixtureMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.7 });
        
        // High Emissive values create a realistic camera flare/glow under ACES Filmic mapping
        const glowGlassMat = new THREE.MeshStandardMaterial({ 
            color: 0xffffff, 
            emissive: 0xffffff, 
            emissiveIntensity: 6.0,
            roughness: 0.1 
        });

        // --- Pitch Dark Environment Baseline ---
        const ambientLight = new THREE.AmbientLight(0x000000, 0.0); // No ambient light for pure blackness
        scene.add(ambientLight);

        // --- Interactive 3D Flashlight Logic ---
        const flashlight = new THREE.SpotLight(0xfffbe6, 18, 20, Math.PI / 6, 0.5, 1.5);
        flashlight.castShadow = false; // Disabled for mobile VR performance
        scene.add(flashlight);
        scene.add(flashlight.target);

        // Physical flashlight cylinder mesh
        const flashGeo = new THREE.CylinderGeometry(0.02, 0.025, 0.2);
        flashGeo.rotateX(Math.PI / 2);
        const flashMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.2 });
        const flashMesh = new THREE.Mesh(flashGeo, flashMat);

        // --- VR Arms & Hands Tracking Infrastructure ---
        const controller1 = renderer.xr.getController(0); // Left Hand
        const controller2 = renderer.xr.getController(1); // Right Hand
        userRig.add(controller1);
        userRig.add(controller2);

        // Pale clean skin / suit textures matching the liminal vibe
        const limbMaterial = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.6 });
        
        // Build Geometric Arms/Hands
        function attachArm(controller, isRightHand) {
            const handMesh = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, 0.12), limbMaterial);
            controller.add(handMesh);

            // Forearm mesh extending back down your real-world arm space
            const forearmGeo = new THREE.CylinderGeometry(0.04, 0.045, 0.45);
            forearmGeo.rotateX(Math.PI / 2);
            const forearmMesh = new THREE.Mesh(forearmGeo, limbMaterial);
            forearmMesh.position.set(0, -0.02, 0.22); // Extends back towards player body
            controller.add(forearmMesh);

            if (isRightHand) {
                // Attach the flashlight physically to your right hand
                controller.add(flashMesh);
            }
        }
        attachArm(controller1, false);
        attachArm(controller2, true);

        // --- Architectural Corridor Generation ---
        const segmentLength = 10;
        const totalSegments = 8; 
        const hallwayWidth = 2.6;
        const hallwayHeight = 3.0;
        const segments = [];

        function createHallwaySegment(zOffset) {
            const segment = new THREE.Group();

            // Left & Right Walls
            const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(segmentLength, hallwayHeight), wallMaterial);
            leftWall.position.set(-hallwayWidth/2, hallwayHeight/2, 0);
            leftWall.rotation.y = Math.PI / 2;
            segment.add(leftWall);

            const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(segmentLength, hallwayHeight), wallMaterial);
            rightWall.position.set(hallwayWidth/2, hallwayHeight/2, 0);
            rightWall.rotation.y = -Math.PI / 2;
            segment.add(rightWall);

            // Structural Pillars protruding from the architecture
            const pillarGeo = new THREE.BoxGeometry(0.2, hallwayHeight, 0.4);
            [-segmentLength/2, segmentLength/2].forEach(posZ => {
                const lp = new THREE.Mesh(pillarGeo, pillarMaterial);
                lp.position.set(-hallwayWidth/2 + 0.1, hallwayHeight/2, posZ);
                const rp = new THREE.Mesh(pillarGeo, pillarMaterial);
                rp.position.set(hallwayWidth/2 - 0.1, hallwayHeight/2, posZ);
                segment.add(lp, rp);
            });

            // Ceiling Grid
            const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(hallwayWidth, segmentLength), roofMaterial);
            ceiling.position.set(0, hallwayHeight, 0);
            ceiling.rotation.x = Math.PI / 2;
            segment.add(ceiling);

            // Floorboards baseline
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(hallwayWidth, segmentLength), floorMaterial);
            floor.position.set(0, 0, 0);
            floor.rotation.x = -Math.PI / 2;
            segment.add(floor);

            // Realistic Linear Office Fluorescent Box
            const fixture = new THREE.Group();
            const casing = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.05, 3.0), fixtureMat);
            const bulb = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.02, 2.9), glowGlassMat);
            casing.position.set(0, hallwayHeight - 0.025, 0);
            bulb.position.set(0, hallwayHeight - 0.05, 0);
            fixture.add(casing, bulb);

            // Dynamic Point Light matching bulb emission
            const overheadLight = new THREE.PointLight(0xfff5e6, 3.5, 9, 1.8);
            overheadLight.position.set(0, hallwayHeight - 0.1, 0);
            fixture.add(overheadLight);
            segment.add(fixture);

            // Metadata handles for rendering loops
            segment.userData = {
                floorMesh: floor,
                overheadLight: overheadLight,
                bulbMesh: bulb,
                flickerTimer: Math.random() * 6,
                isFlickering: false
            };

            segment.position.z = zOffset;
            return segment;
        }

        // Generate Starting Corridor Map
        for (let i = 0; i < totalSegments; i++) {
            const seg = createHallwaySegment(-i * segmentLength);
            scene.add(seg);
            segments.push(seg);
        }

        // --- Precision VR Input Controller System ---
        const moveSpeed = 1.6; 
        const clock = new THREE.Clock();
        let canSnapTurn = true;

        function handleVRLocomotion(delta) {
            const session = renderer.xr.getSession();
            if (!session) return;

            for (const source of session.inputSources) {
                if (!source.gamepad) continue;
                const axes = source.gamepad.axes;
                if (axes.length < 2) continue;

                const xAxis = axes[0]; 
                const yAxis = axes[1]; 

                // LEFT HAND JOYSTICK: Move & Strafe relative to Head orientation
                if (source.handedness === 'left') {
                    if (Math.abs(xAxis) > 0.15 || Math.abs(yAxis) > 0.15) {
                        const direction = new THREE.Vector3();
                        camera.getWorldDirection(direction);
                        direction.y = 0; // Lock to flat ground
                        direction.normalize();

                        const side = new THREE.Vector3();
                        side.crossVectors(direction, camera.up).normalize();

                        userRig.position.addScaledVector(direction, -yAxis * moveSpeed * delta);
                        userRig.position.addScaledVector(side, xAxis * moveSpeed * delta);
                    }
                }

                // RIGHT HAND JOYSTICK: Smooth Snap Rotation
                if (source.handedness === 'right') {
                    if (Math.abs(xAxis) > 0.7) {
                        if (canSnapTurn) {
                            userRig.rotateY(xAxis > 0 ? -Math.PI / 4 : Math.PI / 4);
                            canSnapTurn = false;
                        }
                    } else { canSnapTurn = true; }
                }
            }
        }

        // --- Spooky Fluorescent Flickering Engine ---
        function handleFlickerSystem(delta) {
            segments.forEach((seg) => {
                const data = seg.userData;
                data.flickerTimer -= delta;

                if (data.flickerTimer <= 0) {
                    data.isFlickering = Math.random() > 0.82; 
                    data.flickerTimer = data.isFlickering ? Math.random() * 0.4 : Math.random() * 12 + 6;
                }

                if (data.isFlickering) {
                    const seed = Math.random();
                    if (seed > 0.8) {
                        data.overheadLight.intensity = 5.0; // Power surge flare
                        data.bulbMesh.material.emissiveIntensity = 6.0;
                    } else if (seed > 0.3) {
                        data.overheadLight.intensity = 0.1; // Voltage drop frame
                        data.bulbMesh.material.emissiveIntensity = 0.2;
                    } else {
                        data.overheadLight.intensity = 0.0; // Complete dead blackout
                        data.bulbMesh.material.emissiveIntensity = 0.0;
                    }
                } else {
                    // Stable low hum radiation
                    data.overheadLight.intensity = 2.8 + (Math.sin(Date.now() * 0.006 + seg.position.z) * 0.1);
                    data.bulbMesh.material.emissiveIntensity = 4.0;
                }
            });
        }

        // --- Endless Corridor Loop Realignment ---
        function handleInfiniteTracking() {
            segments.forEach((seg) => {
                if (seg.position.z > userRig.position.z + segmentLength) {
                    let furthestZ = userRig.position.z;
                    segments.forEach(s => { if (s.position.z < furthestZ) furthestZ = s.position.z; });
                    
                    seg.position.z = furthestZ - segmentLength;
                    
                    // Shuffle floors procedurally behind the fog wall (Light boards or Carpet tiles)
                    const swapToCarpet = Math.random() > 0.8;
                    seg.userData.floorMesh.material = swapToCarpet ? carpetMaterial : floorMaterial;
                }
            });
        }

        // --- Frame Tick Rendering Loop ---
        renderer.setAnimationLoop(() => {
            const delta = clock.getDelta();

            handleVRLocomotion(delta);
            handleFlickerSystem(delta);
            handleInfiniteTracking();

            // Track Flashlight position matrix directly to the right controller index
            if (renderer.xr.isPresenting && controller2.visible) {
                const flashWorldPos = new THREE.Vector3();
                const flashWorldDir = new THREE.Vector3();
                
                flashMesh.getWorldPosition(flashWorldPos);
                flashMesh.getWorldDirection(flashWorldDir);

                flashlight.position.copy(flashWorldPos);
                // Invert direction matrix so it shoots perfectly out from the barrel tip
                flashlight.target.position.copy(flashWorldPos).add(flashWorldDir.negate());
            } else {
                // Desktop/No Controller Fallback: Lock light directly onto player face coordinate
                const fallbackPos = new THREE.Vector3();
                camera.getWorldPosition(fallbackPos);
                flashlight.position.copy(fallbackPos);

                const fallbackDir = new THREE.Vector3();
                camera.getWorldDirection(fallbackDir);
                flashlight.target.position.copy(fallbackPos).add(fallbackDir);
            }

            renderer.render(scene, camera);
        });

        // Window configuration updates
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
