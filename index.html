<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Halls - VR Experience</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #020202;
            font-family: 'Courier New', Courier, monospace;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #111 0%, #000 100%);
            color: white;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        h1 { 
            font-size: 3rem;
            margin-bottom: 20px; 
            letter-spacing: 8px;
            color: #b00;
            text-shadow: 0 0 10px rgba(255,0,0,0.5);
        }
        #vr-button {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            background-color: #111;
            color: #fff;
            border: 2px solid #333;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        #vr-button:hover {
            background-color: #b00;
            border-color: #ff0000;
            box-shadow: 0 0 15px #b00;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="overlay">
        <h1>HALLS</h1>
        <button id="vr-button">LOADING VR...</button>
    </div>

    <script>
        // --- Setup Scene, Camera, and Renderer ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020202);
        // Tighter fog for depth and better shadow falloff
        scene.fog = new THREE.FogExp2(0x020202, 0.25);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        // Enable physically correct lighting mapping
        renderer.physicallyCorrectLights = true;
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        // --- Rig for Joystick Movement ---
        const userRig = new THREE.Group();
        userRig.add(camera);
        scene.add(userRig);

        // --- Setup User WebXR Request Prompt ---
        const vrButton = document.getElementById('vr-button');
        const overlay = document.getElementById('overlay');

        if (navigator.xr) {
            navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                if (supported) {
                    vrButton.textContent = 'ENTER VR';
                    vrButton.style.borderColor = '#b00';
                    
                    vrButton.addEventListener('click', () => {
                        navigator.xr.requestSession('immersive-vr', {
                            requiredFeatures: ['local-floor']
                        }).then((session) => {
                            renderer.xr.setSession(session);
                            overlay.style.opacity = '0';
                            setTimeout(() => overlay.style.display = 'none', 500);
                        }).catch(err => {
                            console.error("Failed to start VR Session:", err);
                            vrButton.textContent = 'ERROR ENTERING VR';
                        });
                    });
                } else {
                    vrButton.textContent = 'HEADSET NOT DETECTED';
                }
            });
        } else {
            vrButton.textContent = 'WEBXR NOT SUPPORTED';
        }

        // --- Texture Loading & Polishing ---
        const textureLoader = new THREE.TextureLoader();
        
        const ventTex = textureLoader.load('https://i.postimg.cc/rwxxRpCn/Vent-Tex.png');
        const roofTex = textureLoader.load('https://i.postimg.cc/MTFvFkmq/Tile3.png');
        const floorTex = textureLoader.load('https://i.postimg.cc/dtdjrnJ0/Backing.png');
        const carpetTex = textureLoader.load('https://i.postimg.cc/pd0fR6BW/Brown-Carpet.png');

        [roofTex, floorTex, carpetTex].forEach(t => {
            t.wrapS = THREE.RepeatWrapping;
            t.wrapT = THREE.RepeatWrapping;
        });
        roofTex.repeat.set(1, 4);
        floorTex.repeat.set(1, 4);
        carpetTex.repeat.set(1, 4);

        // Materials with high roughness values so they don't look shiny/plastic under lights
        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x1f1f1f, roughness: 0.95, metalness: 0.1 });
        const ventMaterial = new THREE.MeshStandardMaterial({ map: ventTex, transparent: true, roughness: 0.7 });
        const roofMaterial = new THREE.MeshStandardMaterial({ map: roofTex, roughness: 0.9 });
        const floorMaterial = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.85 });
        const carpetMaterial = new THREE.MeshStandardMaterial({ map: carpetTex, roughness: 1.0 });

        // --- Polished Cinematic Lighting ---
        const ambientLight = new THREE.AmbientLight(0x0a0a14, 0.2); // Extremely subtle blue ambient hum
        scene.add(ambientLight);

        // Flashlight: Converted to a SpotLight for authentic conical beam + edge attenuation
        const flashlight = new THREE.SpotLight(0xfff6e0, 8, 15, Math.PI / 3.5, 0.6, 1.5);
        scene.add(flashlight);
        scene.add(flashlight.target); // Spotlights need a tracked target object

        // Ceiling Light: Sickly fluorescent green-ish white point light
        const ceilingLight = new THREE.PointLight(0xd9e8ff, 6, 10, 2.0);
        ceilingLight.position.set(0, 3.1, -4);
        scene.add(ceilingLight);

        // --- Intelligent Light Flickering Engine ---
        let flickerTimer = 0;
        let isFlickering = false;
        let baseIntensity = 6.0;

        function updateFlicker(delta) {
            flickerTimer -= delta;
            if (flickerTimer <= 0) {
                isFlickering = Math.random() > 0.65; // Dynamic intervals
                flickerTimer = isFlickering ? Math.random() * 0.4 : Math.random() * 5 + 3; 
            }

            if (isFlickering) {
                const rand = Math.random();
                if (rand > 0.85) ceilingLight.intensity = baseIntensity * 1.5;  // Power surge
                else if (rand > 0.4) ceilingLight.intensity = baseIntensity * 0.1; // Deep drop
                else ceilingLight.intensity = 0.0;                              // Total blackout frame
            } else {
                // Natural organic current humming vibration
                ceilingLight.intensity = baseIntensity + (Math.sin(Date.now() * 0.05) * 0.3);
            }
        }

        // --- Hallway Architecture ---
        const segmentLength = 10;
        const totalSegments = 6;
        const hallwayWidth = 2.6;
        const hallwayHeight = 3.2;
        const segments = [];

        function createHallwaySegment(zOffset) {
            const segment = new THREE.Group();

            // Left Wall
            const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(segmentLength, hallwayHeight), wallMaterial);
            leftWall.position.set(-hallwayWidth/2, hallwayHeight/2, 0);
            leftWall.rotation.y = Math.PI / 2;
            segment.add(leftWall);

            // Right Wall
            const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(segmentLength, hallwayHeight), wallMaterial);
            rightWall.position.set(hallwayWidth/2, hallwayHeight/2, 0);
            rightWall.rotation.y = -Math.PI / 2;
            segment.add(rightWall);

            // Side Vents
            if (Math.random() > 0.4) {
                const vent = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 1.4), ventMaterial);
                const side = Math.random() > 0.5 ? 1 : -1;
                vent.position.set((hallwayWidth/2 - 0.005) * side, hallwayHeight * 0.65, (Math.random() - 0.5) * 6);
                vent.rotation.y = side === 1 ? -Math.PI / 2 : Math.PI / 2;
                segment.add(vent);
            }

            // Ceiling (Roof Tiles)
            const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(hallwayWidth, segmentLength), roofMaterial);
            ceiling.position.set(0, hallwayHeight, 0);
            ceiling.rotation.x = Math.PI / 2;
            segment.add(ceiling);

            // Floor Selection (Tile or Carpet)
            const useCarpet = Math.random() > 0.75;
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(hallwayWidth, segmentLength), 
                useCarpet ? carpetMaterial : floorMaterial
            );
            floor.position.set(0, 0, 0);
            floor.rotation.x = -Math.PI / 2;
            segment.add(floor);

            segment.position.z = zOffset;
            return segment;
        }

        // Build track
        for (let i = 0; i < totalSegments; i++) {
            const seg = createHallwaySegment(-i * segmentLength);
            scene.add(seg);
            segments.push(seg);
        }

        // --- VR Smooth Joystick Locomotion ---
        const moveSpeed = 1.6; 
        const clock = new THREE.Clock();

        function handleMovement(delta) {
            const session = renderer.xr.getSession();
            if (!session) return;

            for (const source of session.inputSources) {
                if (source.gamepad && source.gamepad.axes) {
                    const axes = source.gamepad.axes;
                    
                    // Left stick maps to primary axes array positions [0, 1]
                    const x = axes[0] || 0; 
                    const z = axes[1] || 0; 

                    if (Math.abs(x) > 0.1 || Math.abs(z) > 0.1) {
                        const direction = new THREE.Vector3();
                        camera.getWorldDirection(direction);
                        direction.y = 0; // Lock to ground plane
                        direction.normalize();

                        const side = new THREE.Vector3();
                        side.crossVectors(direction, camera.up).normalize();

                        userRig.position.addScaledVector(direction, -z * moveSpeed * delta);
                        userRig.position.addScaledVector(side, x * moveSpeed * delta);
                    }
                }
            }
        }

        // --- Frame Render Execution Loop ---
        renderer.setAnimationLoop(() => {
            const delta = clock.getDelta();

            handleMovement(delta);
            updateFlicker(delta);

            // Lock Flashlight origin to Headset Rig space
            const headPos = new THREE.Vector3();
            camera.getWorldPosition(headPos);
            flashlight.position.copy(headPos);

            // Direct Spotlight target slightly forward from head direction vector
            const dirVector = new THREE.Vector3();
            camera.getWorldDirection(dirVector);
            flashlight.target.position.copy(headPos).add(dirVector);

            // Lock ceiling lamp relative distance track ahead of player coordinate track
            ceilingLight.position.z = userRig.position.z - 5;

            // Infinite Room Recycling Loop
            segments.forEach((seg) => {
                if (seg.position.z > userRig.position.z + segmentLength) {
                    let furthestZ = userRig.position.z;
                    segments.forEach(s => { if (s.position.z < furthestZ) furthestZ = s.position.z; });
                    
                    seg.position.z = furthestZ - segmentLength;
                    
                    // Dynamically shuffle floor assignments on segment generation loops
                    const floorMesh = seg.children.find(c => c.rotation.x === -Math.PI / 2);
                    if(floorMesh) floorMesh.material = Math.random() > 0.75 ? carpetMaterial : floorMaterial;
                }
            });

            renderer.render(scene, camera);
        });

        // Resize updates
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
