<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VR Art Studio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #2c2c2c 0%, #111 100%);
            color: white;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        h1 { 
            font-size: 2.5rem;
            margin-bottom: 10px; 
            letter-spacing: 4px;
            font-weight: 300;
        }
        p {
            color: #aaa;
            margin-bottom: 30px;
        }
        #vr-button {
            padding: 16px 40px;
            font-size: 1rem;
            font-weight: 600;
            background-color: transparent;
            color: #fff;
            border: 2px solid #ffffff;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        #vr-button:hover {
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="overlay">
        <h1>V R  A R T  S T U D I O</h1>
        <p>Pick up your brush, select a color, and paint.</p>
        <button id="vr-button">ENTER STUDIO</button>
    </div>

    <script>
        // --- Core Scene & Lighting Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1512); // Warm ambient atmosphere

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.6, 0); // Default head height

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        // --- WebXR Session Management ---
        const vrButton = document.getElementById('vr-button');
        const overlay = document.getElementById('overlay');

        if (navigator.xr) {
            navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
                if (supported) {
                    vrButton.addEventListener('click', () => {
                        navigator.xr.requestSession('immersive-vr', { requiredFeatures: ['local-floor'] })
                        .then((session) => {
                            renderer.xr.setSession(session);
                            overlay.style.opacity = '0';
                            setTimeout(() => overlay.style.display = 'none', 500);
                        });
                    });
                } else { vrButton.textContent = 'VR HEADSET NOT DETECTED'; }
            });
        }

        // --- Procedural Texture Generation for Realism ---
        function createWoodTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#8B5A2B'; ctx.fillRect(0, 0, 512, 512);
            ctx.fillStyle = '#5C3A21';
            for (let i = 0; i < 500; i++) {
                ctx.fillRect(Math.random() * 512, 0, Math.random() * 2 + 1, 512);
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createContextures() {
            const wood = createWoodTexture();
            wood.wrapS = THREE.RepeatWrapping; wood.wrapT = THREE.RepeatWrapping;
            return { wood };
        }
        const textures = createContextures();

        // --- Studio Architecture & Lighting Layout ---
        // Soft Warm Studio Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const studioLight = new THREE.DirectionalLight(0xfff3e0, 1.2);
        studioLight.position.set(5, 8, 2);
        scene.add(studioLight);

        // Room Shell (Walls, Floor, Roof)
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xefefef, roughness: 0.8 });
        const floorMat = new THREE.MeshStandardMaterial({ map: textures.wood, roughness: 0.4 });
        floorMat.map.repeat.set(4, 4);
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 });

        const room = new THREE.Group();
        const floorGeo = new THREE.PlaneGeometry(10, 10);
        const floor = new THREE.Mesh(floorGeo, floorMat); floor.rotation.x = -Math.PI / 2; room.add(floor);
        const roof = new THREE.Mesh(floorGeo, roofMat); roof.position.y = 4; roof.rotation.x = Math.PI / 2; room.add(roof);

        // Back Wall
        const wallGeo = new THREE.PlaneGeometry(10, 4);
        const backWall = new THREE.Mesh(wallGeo, wallMat); backWall.position.set(0, 2, -5); room.add(backWall);
        // Left & Right Walls
        const leftWall = new THREE.Mesh(wallGeo, wallMat); leftWall.position.set(-5, 2, 0); leftWall.rotation.y = Math.PI / 2; room.add(leftWall);
        const rightWall = new THREE.Mesh(wallGeo, wallMat); rightWall.position.set(5, 2, 0); rightWall.rotation.y = -Math.PI / 2; room.add(rightWall);
        scene.add(room);

        // --- Dynamic Painting Paper Construction ---
        const drawCanvas = document.createElement('canvas');
        drawCanvas.width = 1024; drawCanvas.height = 1024;
        const drawCtx = drawCanvas.getContext('2d');
        drawCtx.fillStyle = '#ffffff'; // Clean white sheet
        drawCtx.fillRect(0, 0, 1024, 1024);

        const canvasTexture = new THREE.CanvasTexture(drawCanvas);
        const canvasMaterial = new THREE.MeshStandardMaterial({ map: canvasTexture, roughness: 0.95 });

        // --- Building the Easel & Art Supplies Table ---
        const easelGroup = new THREE.Group();
        easelGroup.position.set(0, 0, -1.5); // Placed comfortably in front of player spawn

        // Wooden Framing Components
        const easelMat = new THREE.MeshStandardMaterial({ map: textures.wood, roughness: 0.6 });
        const legGeo = new THREE.BoxGeometry(0.06, 2.2, 0.06);
        const leftLeg = new THREE.Mesh(legGeo, easelMat); leftLeg.position.set(-0.4, 1.1, 0); leftLeg.rotation.z = -0.1;
        const rightLeg = new THREE.Mesh(legGeo, easelMat); rightLeg.position.set(0.4, 1.1, 0); rightLeg.rotation.z = 0.1;
        const backLeg = new THREE.Mesh(legGeo, easelMat); backLeg.position.set(0, 1.1, -0.4); backLeg.rotation.x = -0.2;
        easelGroup.add(leftLeg, rightLeg, backLeg);

        // The drawing board supporting the paper
        const boardGeo = new THREE.BoxGeometry(1.2, 0.9, 0.04);
        const board = new THREE.Mesh(boardGeo, easelMat);
        board.position.set(0, 1.4, -0.05);
        board.rotation.x = -0.05; // Slanted slightly back like a real easel
        easelGroup.add(board);

        // The actual Paper Sheet you draw on
        const paperGeo = new THREE.PlaneGeometry(1.1, 0.8);
        const paperMesh = new THREE.Mesh(paperGeo, canvasMaterial);
        paperMesh.position.set(0, 1.4, -0.028);
        paperMesh.rotation.x = -0.05;
        easelGroup.add(paperMesh);
        scene.add(easelGroup);

        // Supply Table Construction
        const tableGroup = new THREE.Group();
        tableGroup.position.set(0.8, 0, -1.2); // Positioned conveniently to the right
        const topGeo = new THREE.BoxGeometry(0.8, 0.05, 1.2);
        const tableTop = new THREE.Mesh(topGeo, easelMat); tableTop.position.y = 0.75; tableGroup.add(tableTop);
        const legG = new THREE.BoxGeometry(0.05, 0.75, 0.05);
        for(let x of [-0.35, 0.35]) {
            for(let z of [-0.5, 0.5]) {
                const leg = new THREE.Mesh(legG, easelMat); leg.position.set(x, 0.375, z); tableGroup.add(leg);
            }
        }
        scene.add(tableGroup);

        // --- Interactive Palettes & Brush Tools Configuration ---
        const paintOptions = [
            { color: 0xff0000, hex: '#ff0000', pos: new THREE.Vector3(-0.2, 0.79, -0.3) }, // Red
            { color: 0x00ff00, hex: '#00ff00', pos: new THREE.Vector3(0.0, 0.79, -0.3) },  // Green
            { color: 0x0000ff, hex: '#0000ff', pos: new THREE.Vector3(0.2, 0.79, -0.3) },  // Blue
            { color: 0xffcc00, hex: '#ffcc00', pos: new THREE.Vector3(-0.2, 0.79, -0.1) }, // Yellow
            { color: 0x000000, hex: '#000000', pos: new THREE.Vector3(0.0, 0.79, -0.1) },  // Black
            { color: 0xffffff, hex: '#ffffff', pos: new THREE.Vector3(0.2, 0.79, -0.1) }   // White
        ];

        const targetTargets = []; // Collision targets array

        paintOptions.forEach(opt => {
            const trayGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.02, 16);
            const trayMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 });
            const tray = new THREE.Mesh(trayGeo, trayMat);
            tray.position.copy(opt.pos);
            tableGroup.add(tray);

            const fluidGeo = new THREE.CylinderGeometry(0.055, 0.055, 0.015, 16);
            const fluidMat = new THREE.MeshStandardMaterial({ color: opt.color, roughness: 0.2 });
            const fluid = new THREE.Mesh(fluidGeo, fluidMat);
            fluid.position.copy(opt.pos).add(new THREE.Vector3(0, 0.005, 0));
            fluid.userData = { type: 'color', val: opt.hex };
            tableGroup.add(fluid);
            targetTargets.push(fluid);
        });

        // Brush Size Selector Pots
        const sizeOptions = [
            { radius: 6, label: 'Small', pos: new THREE.Vector3(-0.15, 0.79, 0.2) },
            { radius: 16, label: 'Medium', pos: new THREE.Vector3(0.0, 0.79, 0.2) },
            { radius: 32, label: 'Large', pos: new THREE.Vector3(0.15, 0.79, 0.2) }
        ];

        sizeOptions.forEach(opt => {
            const potGeo = new THREE.BoxGeometry(0.08, 0.04, 0.08);
            const potMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.4 });
            const pot = new THREE.Mesh(potGeo, potMat);
            pot.position.copy(opt.pos);
            pot.userData = { type: 'size', val: opt.radius };
            tableGroup.add(pot);
            targetTargets.push(pot);

            // Miniature display labels inside pots
            const dotGeo = new THREE.CylinderGeometry(opt.radius/1000 + 0.002, opt.radius/1000 + 0.002, 0.042, 8);
            const dotMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const dot = new THREE.Mesh(dotGeo, dotMat);
            dot.position.copy(opt.pos);
            tableGroup.add(dot);
        });

        // --- Active Painting System State ---
        let currentColor = '#ff0000';
        let currentSize = 16;
        let isDrawing = false;
        let lastX = null; let lastY = null;

        // --- VR Controllers & Physical Brushes Tracking ---
        const raycaster = new THREE.Raycaster();
        const controllerRight = renderer.xr.getController(1); // Right hand tool hand
        scene.add(controllerRight);

        // Visual Pointer Ray Line
        const laserGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-3)]);
        const laserMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4 });
        const laser = new THREE.Line(laserGeo, laserMat);
        controllerRight.add(laser);

        // Model physical Artist Brush Mesh attachment
        const brushHandleGeo = new THREE.CylinderGeometry(0.008, 0.005, 0.25);
        brushHandleGeo.rotateX(Math.PI / 2);
        const brushHandle = new THREE.Mesh(brushHandleGeo, easelMat);
        brushHandle.position.set(0, 0, -0.08);
        controllerRight.add(brushHandle);

        const tipGeo = new THREE.CylinderGeometry(0.001, 0.008, 0.03);
        tipGeo.rotateX(Math.PI / 2);
        const tipMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const brushTip = new THREE.Mesh(tipGeo, tipMat);
        brushTip.position.set(0, 0, -0.21); // Extends straight out to act as pointer tip
        controllerRight.add(brushTip);

        // Standard WebXR Controller Event Binding hooks
        controllerRight.addEventListener('selectstart', () => { isDrawing = true; });
        controllerRight.addEventListener('selectend', () => { 
            isDrawing = false; 
            lastX = null; lastY = null; // Break continuous line sequence
        });

        // --- Game Tick Execution Frame Loop ---
        renderer.setAnimationLoop(() => {
            // Update Dynamic Laser & Raycaster Tracking Vectors
            const tempMatrix = new THREE.Matrix4();
            tempMatrix.identity().extractRotation(controllerRight.matrixWorld);
            
            raycaster.ray.origin.setFromMatrixPosition(controllerRight.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

            // Check if user is pointing at the Easel Canvas Plane
            const canvasIntersects = raycaster.intersectObject(paperMesh);

            if (canvasIntersects.length > 0) {
                const hit = canvasIntersects[0];
                const uv = hit.uv;

                // Map 3D UV space coordinates to 2D HTML Canvas pixels
                const x = uv.x * drawCanvas.width;
                const y = (1 - uv.y) * drawCanvas.height;

                // Adjust pointer line to dynamically collapse right at the contact point
                laser.scale.z = hit.distance / 3;

                if (isDrawing) {
                    drawCtx.strokeStyle = currentColor;
                    drawCtx.fillStyle = currentColor;
                    drawCtx.lineCap = 'round';
                    drawCtx.lineJoin = 'round';
                    drawCtx.lineWidth = currentSize;

                    drawCtx.beginPath();
                    if (lastX !== null && lastY !== null) {
                        drawCtx.moveTo(lastX, lastY);
                        drawCtx.lineTo(x, y);
                        drawCtx.stroke();
                    } else {
                        // Single point tap fallback
                        drawCtx.arc(x, y, currentSize / 2, 0, Math.PI * 2);
                        drawCtx.fill();
                    }
                    drawCtx.closePath();

                    lastX = x; lastY = y;
                    canvasTexture.needsUpdate = true; // Refresh GPU Texture Map
                }
            } else {
                // If not pointing at canvas, restore full pointer distance metric
                laser.scale.z = 1;
                lastX = null; lastY = null;

                // Check if user is interacting with table supply pots
                if (isDrawing) {
                    const supplyIntersects = raycaster.intersectObjects(targetTargets);
                    if (supplyIntersects.length > 0) {
                        const hitData = supplyIntersects[0].object.userData;
                        
                        if (hitData.type === 'color') {
                            currentColor = hitData.val;
                            tipMat.color.set(hitData.val); // Physically dye brush bristles
                        } else if (hitData.type === 'size') {
                            currentSize = hitData.val;
                        }
                        isDrawing = false; // Prevent click spamming continuous state flags
                    }
                }
            }

            renderer.render(scene, camera);
        });

        // Window configuration updates
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
